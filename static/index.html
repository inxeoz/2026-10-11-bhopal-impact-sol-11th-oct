<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rules Checker · M.P. Bhumi Vikas Rules</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar" data-testid="header">
    <div class="wrap">
      <div class="brand" data-testid="header-brand">
        <h1 data-testid="header-title">Rules Checker</h1>
        <p class="sub" data-testid="header-subtitle">M.P. Bhumi Vikas Rules, 2012</p>
      </div>
      <nav class="tracks" role="tablist" data-testid="nav-tabs">
        <button class="tab" data-testid="nav-tab-building-rules" data-track="bhumi-vikas" role="tab">Building rules</button>
        <button class="tab" data-testid="nav-tab-draw-plot" data-track="draw" role="tab">Draw plot</button>
        <button class="tab" data-testid="nav-tab-document" data-track="doc" role="tab">Document</button>
      </nav>
    </div>
  </header>

  <main class="wrap" data-testid="main">
    <!-- TRACK 1 -->
    <section id="view-bhumi-vikas" class="view" data-testid="view-building-rules" hidden>
      <p class="lede" data-testid="ask-intro">Ask a question about the building rules. Every answer quotes the rule it comes from.</p>

      <form id="ask-form" class="askbar" data-testid="ask-form" autocomplete="off">
        <div class="ask-field" data-testid="ask-field">
          <input id="q" type="text" data-testid="ask-input" placeholder="e.g. My plot is 200 sq m on a 9 m road. How much gap at the front?" />
          <button type="button" id="mic" class="mic" data-testid="ask-voice" title="Record your question" aria-label="Record your question" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
            </svg>
            <span class="mic-stop" aria-hidden="true"></span>
          </button>
        </div>
        <div class="askbar-side">
          <button class="primary" type="submit" data-testid="ask-submit">Ask</button>
          <button class="ghost" type="button" id="reset" data-testid="ask-clear" title="Clear the question and the answer" hidden>Clear</button>
        </div>
      </form>
      <!-- Voice bar: data-state="recording" while the mic is open, "saved" once a clip is kept. -->
      <div id="voice-clip" class="voice-clip" data-testid="ask-voice-clip" data-state="saved" hidden>
        <span class="clip-meter rec-only" data-testid="ask-voice-level" aria-hidden="true"><i></i></span>
        <button type="button" id="clip-play" class="clip-play saved-only" data-testid="ask-voice-clip-play" title="Play recording" aria-label="Play recording">
          <svg class="i-play" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></svg>
        </button>
        <span class="clip-label">Recording <span id="clip-length" data-testid="ask-voice-clip-length">0:00</span></span>
        <select id="mic-device" class="clip-device" data-testid="ask-voice-device" aria-label="Microphone" title="Microphone" hidden></select>
        <button type="button" id="clip-cancel" class="clip-link rec-only" data-testid="ask-voice-cancel" title="Throw this recording away (Esc)">Cancel</button>
        <button type="button" id="clip-again" class="clip-link saved-only" data-testid="ask-voice-clip-record-again">Record again</button>
        <button type="button" id="clip-discard" class="clip-link saved-only" data-testid="ask-voice-clip-delete">Delete</button>
        <button type="button" id="clip-stop" class="primary clip-send rec-only" data-testid="ask-voice-stop">Stop</button>
        <button type="button" id="clip-send" class="primary clip-send saved-only" data-testid="ask-voice-clip-send" title="Send this recording to be turned into text">Send recording</button>
      </div>
      <p id="voice-status" class="voice-status" data-testid="ask-voice-status" role="status" aria-live="polite" hidden></p>

      <div id="examples" class="examples" data-testid="examples"></div>

      <div id="answer" class="answer-wrap" data-testid="answer"></div>
    </section>

    <!-- DRAW PLOT -->
    <section id="view-draw" class="view" data-testid="view-draw-plot" hidden>
      <p class="lede" data-testid="draw-intro">Draw your plot and place the building. Every change is checked against the rules.</p>
      <div id="draw-root" data-testid="draw-root"></div>
    </section>

    <!-- DOCUMENT VIEWER -->
    <section id="view-doc" class="view" data-testid="view-document" hidden>
      <div id="doc-root" data-testid="doc-root"></div>
    </section>
  </main>

  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/" } }
  </script>
  <script type="module" src="/scene3d.js"></script>
  <script type="module" src="/draw.js"></script>
  <script src="/doc.js"></script>
  <script src="/app.js"></script>
</body>
</html>
