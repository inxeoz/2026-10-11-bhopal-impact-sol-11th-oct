[package]
name = "bhopal-sahayak"
version = "0.1.0"
edition = "2021"

[lib]
name = "bhopal_sahayak"
path = "src/lib.rs"

[[bin]]
name = "bhopal-sahayak"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
dotenvy = "0.15"
regex = "1"
tower-http = { version = "0.5", features = ["fs"] }
